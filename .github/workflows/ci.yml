name: CI

on:
  push:
    branches: [main]
  pull_request:
  # publishing a release on GitHub builds and attaches the plug-in: tag vX.Y.Z → chromalab-vX.Y.Z.wasm,
  # tag chromadust-vX.Y.Z → chromadust-vX.Y.Z.wasm
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --release --workspace --all-targets -- -D warnings
      - run: cargo test --release --workspace
      - run: cargo build --release --target wasm32-unknown-unknown -p chromalab -p chromadust
      - uses: actions/upload-artifact@v4
        with:
          name: chromalab-wasm
          path: target/wasm32-unknown-unknown/release/chromalab.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: chromadust-wasm
          path: target/wasm32-unknown-unknown/release/chromadust.wasm

  release:
    # (a prerelease carries its own files: nothing is built or attached for it)
    # tag vX.Y.Z → ChromaLab (chromalab-vX.Y.Z.wasm, notes from "## X.Y.Z");
    # tag chromadust-vX.Y.Z → ChromaDust (chromadust-vX.Y.Z.wasm, notes from "## ChromaDust X.Y.Z")
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Which plug-in, and check the tag matches its Cargo.toml
        run: |
          case "$TAG" in
            chromadust-v*) plugin=chromadust; v=${TAG#chromadust-v}; heading="## ChromaDust $v" ;;
            v*)            plugin=chromalab;  v=${TAG#v};            heading="## $v" ;;
            *) echo "release tag $TAG is neither vX.Y.Z nor chromadust-vX.Y.Z"; exit 1 ;;
          esac
          c=$(grep -m1 '^version' "plugins/$plugin/Cargo.toml" | cut -d'"' -f2)
          test "$c" = "$v" || { echo "release tag $TAG but plugins/$plugin/Cargo.toml says $c"; exit 1; }
          { echo "PLUGIN=$plugin"; echo "VERSION=$v"; echo "HEADING=$heading"; } >> "$GITHUB_ENV"
      - run: cargo build --release --target wasm32-unknown-unknown -p "$PLUGIN"
      - name: Attach the plug-in (and the changelog's notes when the release has none)
        run: |
          cp "target/wasm32-unknown-unknown/release/$PLUGIN.wasm" "$PLUGIN-v$VERSION.wasm"
          gh release upload "$TAG" "$PLUGIN-v$VERSION.wasm" --clobber
          if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
            notes=$(awk -v h="$HEADING" 'index($0, h) == 1 && (length($0) == length(h) || substr($0, length(h) + 1, 1) == " ") {f=1; next} /^## / {f=0} f' CHANGELOG.md)
            gh release edit "$TAG" --notes "$notes"
          fi
